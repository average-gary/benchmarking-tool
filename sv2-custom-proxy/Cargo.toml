[package]
name = "sv2-custom-proxy"
version = "0.1.0"
edition = "2021"

[dependencies]
# Stratum v2 crates from v1.5.0 tag
mining_sv2 = { git = "https://github.com/stratum-mining/stratum.git", tag = "v1.5.0" }
template_distribution_sv2 = { git = "https://github.com/stratum-mining/stratum.git", tag = "v1.5.0" }
parsers_sv2 = { git = "https://github.com/stratum-mining/stratum.git", tag = "v1.5.0" }
codec_sv2 = { git = "https://github.com/stratum-mining/stratum.git", tag = "v1.5.0", features = ["noise_sv2", "with_buffer_pool"] }
network_helpers_sv2 = { git = "https://github.com/stratum-mining/stratum.git", tag = "v1.5.0", features = ["with_buffer_pool"] }
key-utils = { git = "https://github.com/stratum-mining/stratum.git", tag = "v1.5.0" }
async-channel = "1.8.0"

prometheus = "0.13"
warp = "0.3"
tokio = { version = "1.36.0", features = ["full", "tracing"] }
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1.0.120"
log = "0.4.22"
env_logger = "0.11.6"
